<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento Dellamed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', -apple-system, Arial, sans-serif; background: #e7ebf0; color: #1a2b3c; padding: 24px 12px 60px; display: flex; flex-direction: column; align-items: center; }

  .toolbar { width: 210mm; max-width: 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .15s ease; }
  .btn-primary { background: #0F3C6E; color: #fff; }
  .btn-primary:hover { background: #0c3159; }
  .btn-accent { background: #3BBFAD; color: #fff; }
  .btn-accent:hover { background: #33a596; }
  .btn-ghost { background: #fff; color: #0F3C6E; border: 1.5px solid #cdd6e0; }
  .btn-ghost:hover { border-color: #0F3C6E; }
  .toolbar .hint { font-size: 11.5px; color: #64748b; font-weight: 500; flex-basis: 100%; }
  .toolbar .hint b { color: #0F3C6E; }

  .tabs { width: 210mm; max-width: 100%; display: flex; gap: 6px; margin-bottom: 0; }
  .tabbtn { font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: .3px; border: 1.5px solid #cdd6e0; border-bottom: none; background: #dde4ec; color: #64748b; border-radius: 10px 10px 0 0; padding: 11px 24px; cursor: pointer; }
  .tabbtn.active { background: #0F3C6E; color: #fff; border-color: #0F3C6E; }

  .sheet { width: 210mm; min-height: 297mm; background: #fff; padding: 16mm 15mm 14mm; box-shadow: 0 6px 30px rgba(15,60,110,.15); flex-direction: column; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .head .logo { height: 46px; width: auto; }
  .head .doc { text-align: right; }
  .doc .kicker { font-size: 10px; letter-spacing: 3px; color: #36B0C9; font-weight: 700; }
  .doc h1 { font-size: 23px; font-weight: 800; color: #0F3C6E; line-height: 1; margin-top: 2px; white-space: nowrap; }
  .doc .meta { font-size: 11px; color: #475569; margin-top: 8px; }
  .doc .meta b { color: #0F3C6E; font-weight: 600; }
  .rule { height: 3px; background: linear-gradient(90deg,#0F3C6E 0%,#36B0C9 45%,#3BBFAD 75%,#EA6852 100%); border-radius: 3px; margin: 14px 0 16px; }

  .party { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; margin-bottom: 16px; }
  .party .fld { display: flex; flex-direction: column; }
  .party label { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 2px; }
  .party input { font-family: inherit; font-size: 12.5px; font-weight: 500; color: #1a2b3c; border: none; border-bottom: 1px solid #e2e8f0; padding: 3px 0; background: transparent; }
  .party input:focus { outline: none; border-bottom-color: #36B0C9; }
  .party input[readonly] { color: #0F3C6E; font-weight: 600; cursor: default; }

  table { width: 100%; border-collapse: collapse; font-size: 10.5px; table-layout: fixed; }
  thead th { background: #0F3C6E; color: #fff; font-weight: 600; font-size: 8px; letter-spacing: .15px; text-transform: uppercase; padding: 7px 5px; text-align: center; vertical-align: middle; line-height: 1.25; border-right: 1px solid rgba(255,255,255,.18); white-space: nowrap; overflow: hidden; }
  thead th:last-child { border-right: none; }
  thead th:first-child { border-top-left-radius: 6px; }
  thead th:last-child { border-top-right-radius: 6px; }
  tbody td { padding: 0; border-bottom: 1px solid #eef2f6; border-right: 1px solid #eef2f6; vertical-align: top; }
  tbody td:last-child { border-right: none; }
  tbody tr:nth-child(even) td { background: #f7f9fb; }
  tbody input { width: 100%; font-family: inherit; font-size: 10.5px; color: #1a2b3c; border: none; background: transparent; padding: 8px 7px; text-align: right; }
  tbody input:focus { outline: none; background: #eaf6f9; }
  tbody textarea.item { width: 100%; font-family: inherit; font-size: 10.5px; font-weight: 600; color: #0F3C6E; border: none; background: transparent; padding: 8px 7px; text-align: left; resize: none; overflow: hidden; line-height: 1.35; white-space: normal; word-break: break-word; display: block; min-height: 18px; }
  tbody textarea.item:focus { outline: none; background: #eaf6f9; }
  tbody textarea.item::placeholder { font-weight: 500; color: #94a3b8; }
  tbody td.calc { padding: 8px 7px; text-align: right; color: #334155; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; font-size: 10.5px; }
  tbody td.calc.ecotot { font-weight: 600; }
  .num { min-width: 0; }
  td.rm { text-align: center; }
  .rm-btn { border: none; background: transparent; color: #cbd5e1; cursor: pointer; font-size: 15px; line-height: 1; padding: 4px 2px; }
  .rm-btn:hover { color: #EA6852; }

  tfoot td { padding: 9px 7px; font-size: 11px; font-weight: 700; }
  tfoot .lbl { text-align: right; text-transform: uppercase; letter-spacing: .4px; font-size: 9.5px; color: #475569; }
  tfoot .tot { text-align: right; color: #0F3C6E; font-variant-numeric: tabular-nums; }
  tfoot .tot.eco { color: #3BBFAD; }
  tfoot tr:first-child td { border-top: 2px solid #0F3C6E; }

  .acbox { position: absolute; z-index: 1000; display: none; background: #fff; border: 1px solid #cdd6e0; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,60,110,.18); max-height: 260px; overflow-y: auto; font-size: 12px; }
  .acbox .opt { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
  .acbox .opt:last-child { border-bottom: none; }
  .acbox .opt.active, .acbox .opt:hover { background: #eaf6f9; }
  .acbox .opt .code { color: #36B0C9; font-weight: 700; }
  .acbox .none { padding: 8px 10px; color: #94a3b8; }

  .addwrap { margin-top: 8px; }
  .addbtn { border: 1px dashed #cbd5e1; background: #fff; color: #0F3C6E; font-family: inherit; font-weight: 600; font-size: 12px; border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .addbtn:hover { border-color: #36B0C9; color: #36B0C9; }
  .addbtn .plus { font-size: 15px; line-height: 1; }

  .callout { margin-top: 16px; background: #eefaf8; border: 1px solid #bfe9e2; border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
  .callout .txt { font-size: 12px; color: #0F3C6E; font-weight: 600; }
  .callout .txt span { display: block; font-size: 10px; color: #64748b; font-weight: 500; margin-top: 2px; }
  .callout .bigwrap { text-align: right; }
  .callout .big { font-size: 24px; font-weight: 800; color: #3BBFAD; font-variant-numeric: tabular-nums; line-height: 1; }
  .callout .pct { font-size: 11px; font-weight: 600; color: #2e9e8f; margin-top: 3px; }

  .foot { margin-top: auto; padding-top: 18px; }
  .validity { font-size: 9.5px; font-weight: 500; letter-spacing: .3px; text-align: center; color: #94a3b8; border-top: 1px solid #eef2f6; padding-top: 10px; }
  .validity b { color: #64748b; font-weight: 600; }
  .tagline { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10px; color: #94a3b8; }
  .tagline .slogan { color: #36B0C9; font-weight: 600; }

  @media print {
    body { background: #fff; padding: 0; display: block; }
    .toolbar, .tabs { display: none !important; }
    .sheet { box-shadow: none; width: 210mm; min-height: 297mm; padding: 16mm 15mm 14mm; margin: 0 auto; }
    .rm, .rm-btn, .addwrap { display: none !important; }
    tbody input, .party input, tbody textarea.item { border: none !important; }
    thead { display: table-header-group; }
    tbody tr, .callout, .foot, tfoot { break-inside: avoid; page-break-inside: avoid; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>

  if (s.indexOf(',') > -1) s = s.replace(/\./g,'').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function onlyDigits(s){ return String(s||'').replace(/\D/g,''); }
function cnpjKey(s){ return onlyDigits(s).replace(/^0+/, ''); }  // compara ignorando zeros à esquerda (planilha guarda CNPJ como número)
function maskCNPJ(v){
  const d = onlyDigits(v).slice(0,14);
  let o = d;
  if (d.length > 2)  o = d.slice(0,2)+'.'+d.slice(2);
  if (d.length > 5)  o = d.slice(0,2)+'.'+d.slice(2,5)+'.'+d.slice(5);
  if (d.length > 8)  o = d.slice(0,2)+'.'+d.slice(2,5)+'.'+d.slice(5,8)+'/'+d.slice(8);
  if (d.length > 12) o = d.slice(0,2)+'.'+d.slice(2,5)+'.'+d.slice(5,8)+'/'+d.slice(8,12)+'-'+d.slice(12);
  return o;
}

/* ===== Fontes de dados (com fallback embutido) ===== */
let PRODUTOS = (typeof PRODUTOS_EMBED !== 'undefined' ? PRODUTOS_EMBED.slice() : []);
let PRECO = {};
let CNPJ_TO_CLIENTE = {};

function gvizJsonp(aba){
  return new Promise((resolve, reject) => {
    const cb = '__gviz_' + Math.random().toString(36).slice(2);
    let u = 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/gviz/tq?tqx=out:json;responseHandler:' + cb;
    if (aba) u += '&sheet=' + encodeURIComponent(aba);
    u += '&headers=1&_=' + Date.now();
    const s = document.createElement('script');
    let done = false;
    const cleanup = () => { try { delete window[cb]; } catch(e){ window[cb] = undefined; } s.remove(); };
    window[cb] = (resp) => { done = true; cleanup(); resolve(resp); };
    s.onerror = () => { if (!done){ cleanup(); reject(new Error('Falha ao carregar a aba "' + (aba||'primeira') + '"')); } };
    s.src = u;
    document.head.appendChild(s);
    setTimeout(() => { if (!done){ cleanup(); reject(new Error('Tempo esgotado lendo a planilha')); } }, 15000);
  });
}
function cellStr(cell){ if (!cell) return ''; if (cell.v != null) return String(cell.v).trim(); if (cell.f != null) return String(cell.f).trim(); return ''; }
function idxOf(h, names){ for (const n of names){ const k = h.indexOf(n); if (k>=0) return k; } return -1; }
async function carregarDados(){
  if (!CONFIG.SHEET_ID) return false;
  const [rp, rc] = await Promise.all([ gvizJsonp(CONFIG.ABA_PRODUTOS), gvizJsonp(CONFIG.ABA_CLIENTES) ]);
  const tp = rp && rp.table;
  if (tp && tp.rows){
    const prods = [], preco = {};
    tp.rows.forEach(r => {
      if (!r || !r.c) return;
      const item = cellStr(r.c[0]); if (!item) return;
      prods.push(item);
      if (r.c[1] && r.c[1].v != null && String(r.c[1].v).trim() !== '') preco[item] = parseNum(r.c[1].v);
    });
    if (prods.length){ PRODUTOS = prods; PRECO = preco; }
  }
  const tc = rc && rc.table;
  if (tc && tc.rows){
    const labels = (tc.cols || []).map(c => (c && c.label || '').toLowerCase().trim());
    let ni = idxOf(labels, ['cnpj']); if (ni < 0) ni = 1;
    let ci = idxOf(labels, ['clientes','cliente','razão social','razao social','nome']); if (ci < 0) ci = 0;
    const map = {};
    tc.rows.forEach(r => {
      if (!r || !r.c) return;
      const k = cnpjKey(cellStr(r.c[ni])); if (!k) return;
      map[k] = cellStr(r.c[ci]);
    });
    CNPJ_TO_CLIENTE = map;
  }
  return true;
}

/* ===== Combobox pesquisável (fonte + onSelect) ===== */
const acbox = document.getElementById('acbox');
let acActive = null, acIndex = -1, acMatches = [], acList = [], acOnSelect = null;
function acFilter(q, list){
  q = (q||'').trim().toLowerCase();
  const out = [];
  for (let i=0;i<list.length && out.length<60;i++)
    if (!q || list[i].toLowerCase().indexOf(q) > -1) out.push(list[i]);
  return out;
}
function acRender(){
  if (!acMatches.length){ acbox.innerHTML = '<div class="none">Sem correspondência — digite livremente</div>'; return; }
  acbox.innerHTML = acMatches.map((s,i)=>{
    const p = s.split(' - ');
    let inner = (p.length > 1 && /^[\w.\/-]+$/.test(p[0]))
      ? '<span class="code">'+esc(p[0])+'</span> '+esc(p.slice(1).join(' - '))
      : esc(s);
    return '<div class="opt'+(i===acIndex?' active':'')+'" data-i="'+i+'">'+inner+'</div>';
  }).join('');
}
function acPosition(){
  if (!acActive) return;
  const r = acActive.getBoundingClientRect();
  acbox.style.left = (r.left + window.scrollX) + 'px';
  acbox.style.top  = (r.bottom + window.scrollY + 2) + 'px';
  acbox.style.minWidth = Math.max(r.width, 320) + 'px';
}
function acShow(input){ acActive = input; acIndex = -1; acMatches = acFilter(input.value, acList); acRender(); acPosition(); acbox.style.display = 'block'; }
function acClose(){ acbox.style.display = 'none'; acActive = null; acIndex = -1; }
function acEnsureVis(){ const el = acbox.querySelector('.opt.active'); if (el) el.scrollIntoView({block:'nearest'}); }
function acChoose(val){ if (!acActive) return; const inp = acActive, cb = acOnSelect; inp.value = val; inp.dispatchEvent(new Event('input',{bubbles:true})); if (cb) cb(val, inp); acClose(); }
acbox.addEventListener('mousedown', e => { const o = e.target.closest('.opt'); if (!o || !acActive) return; e.preventDefault(); acChoose(acMatches[+o.dataset.i]); });
function attachAC(input, opts){
  opts = opts || {};
  const getList = opts.list || (() => PRODUTOS);
  const onSel = opts.onSelect || null;
  const activate = () => { acActive = input; acList = getList(); acOnSelect = onSel; };
  input.addEventListener('focus', () => { activate(); acShow(input); });
  input.addEventListener('input', () => { activate(); acShow(input); });
  input.addEventListener('blur',  () => setTimeout(() => { if (document.activeElement !== input) acClose(); }, 120));
  input.addEventListener('keydown', e => {
    if (acbox.style.display !== 'block') return;
    if (e.key === 'ArrowDown'){ e.preventDefault(); acIndex = Math.min(acIndex+1, acMatches.length-1); acRender(); acEnsureVis(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); acIndex = Math.max(acIndex-1, 0); acRender(); acEnsureVis(); }
    else if (e.key === 'Enter' && acIndex >= 0 && acMatches[acIndex]){ e.preventDefault(); acChoose(acMatches[acIndex]); }
    else if (e.key === 'Escape'){ acClose(); }
  });
}
window.addEventListener('scroll', () => { if (acActive) acPosition(); }, true);
window.addEventListener('resize', () => { if (acActive) acPosition(); });

/* ===== Layout das duas abas ===== */
const COLS = {
  orc:  ['item','prop','qtd','ult','total','ecoun','ecotot'],
  pros: ['item','prop','qtd','total','orig','ecoun','ecotot']
};
const LABELS = {

  pros: ['ITEM','R$ DA<br>PROPOSTA','QTD<br>(UND.)','R$ TOTAL','R$ ORIGINAL<br>(SEM DESCONTO)','R$ ECONOMIA<br>POR UND.','R$ TOTAL<br>ECONOMIZADO']
};
const REFKEY = { orc:'ult', pros:'orig' };       // coluna de referência p/ economia
const EDIT = new Set(['item','prop','qtd','ult','orig']);

function buildSheet(tab, title, refText){

}

document.getElementById('sheets').innerHTML =
  buildSheet('orc',  'ORÇAMENTO',  'Comparado ao valor da última compra informada') +

/* ===== Linhas ===== */
function cellHTML(key){
  if (key === 'item') return '<td><textarea class="item acinput" rows="1" autocomplete="off" placeholder="Pesquise por código ou nome…"></textarea></td>';
  if (key === 'qtd')  return '<td><input class="qtd num" type="text" placeholder="0"></td>';
  if (EDIT.has(key))  return '<td><input class="'+key+' num" type="text" placeholder="R$ 0,00"></td>';
  return '<td class="calc '+key+'">—</td>';
}
function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function setCalc(tr, key, val, sign){
  const td = tr.querySelector('.'+key); if (!td) return;
  td.textContent = fmt(val);
  if (sign) td.style.color = val >= 0 ? '#2e9e8f' : '#EA6852';
}
// Encolhe TODOS os valores da tabela para o MESMO tamanho, só o necessário para nada quebrar;
// o texto do ITEM acompanha o mesmo tamanho final.
function fitUniform(tab){
  const tbody = document.getElementById('tbody_'+tab);
  const cells = [...tbody.querySelectorAll('.prop, .ult, .orig, .qtd, .calc')];
  const items = [...tbody.querySelectorAll('textarea.item')];
  if (!cells.length) return;
  const BASE = 10.5, MIN = 6.5;
  cells.forEach(el => el.style.fontSize = BASE + 'px');
  if (cells.some(el => !el.clientWidth)){                 // aba oculta: não dá para medir
    items.forEach(t => { t.style.fontSize = BASE + 'px'; autoGrow(t); });
    return;
  }
  const over = () => cells.some(el => el.scrollWidth > el.clientWidth + 0.5);
  let size = BASE, guard = 0;
  while (over() && size > MIN && guard < 40){ size -= 0.5; cells.forEach(el => el.style.fontSize = size + 'px'); guard++; }
  items.forEach(t => { t.style.fontSize = size + 'px'; autoGrow(t); });
}
function recalc(tab){
  const tbody = document.getElementById('tbody_'+tab);
  const rk = REFKEY[tab];
  let sumTotal = 0, sumEco = 0, sumRef = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const prop = parseNum((tr.querySelector('.prop')||{}).value);
    const qtd  = parseNum((tr.querySelector('.qtd')||{}).value);
    const ref  = parseNum((tr.querySelector('.'+rk)||{}).value);
    const total = prop * qtd, ecoun = ref - prop, ecotot = qtd * ecoun;
    setCalc(tr, 'total', total);
    setCalc(tr, 'ecoun', ecoun, true);
    setCalc(tr, 'ecotot', ecotot, true);
    sumTotal += total; sumEco += ecotot; sumRef += ref * qtd;
  });
  const pct = sumRef > 0 ? (sumEco / sumRef * 100) : 0;
  document.getElementById('ftTotal_'+tab).textContent = fmt(sumTotal);
  document.getElementById('ftEco_'+tab).textContent   = fmt(sumEco);
  document.getElementById('coEco_'+tab).textContent   = fmt(sumEco);
  document.getElementById('coPct_'+tab).textContent   = pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '% de economia';
  fitUniform(tab);
}
function buildRow(tab){
  const tbody = document.getElementById('tbody_'+tab);
  const tr = document.createElement('tr');
  tr.innerHTML = COLS[tab].map(cellHTML).join('') + '<td class="rm"><button class="rm-btn" title="Remover item">✕</button></td>';
  tbody.appendChild(tr);
  tr.querySelectorAll('input').forEach(i => i.addEventListener('input', () => recalc(tab)));
  tr.querySelectorAll('.prop, .ult, .orig').forEach(i => {
    i.addEventListener('focus', () => i.select());
    i.addEventListener('blur', () => { i.value = i.value.trim() === '' ? '' : 'R$ ' + BRLnum(parseNum(i.value)); recalc(tab); });
  });
  const ta = tr.querySelector('.item');
  attachAC(ta, { list: () => PRODUTOS, onSelect: (val) => { if (PRECO[val] != null){ const p = tr.querySelector('.prop'); if (p) p.value = 'R$ ' + BRLnum(PRECO[val]); } recalc(tab); } });
  ta.addEventListener('input', () => autoGrow(ta));
  ta.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  autoGrow(ta);
  tr.querySelector('.rm-btn').addEventListener('click', () => { tr.remove(); recalc(tab); });
  return tr;
}

/* ===== CNPJ -> Cliente ===== */
function initParty(tab){
  const cnpj = document.getElementById('cnpj_'+tab);
  const cli  = document.getElementById('cli_'+tab);
  cnpj.addEventListener('input', () => {
    cnpj.value = maskCNPJ(cnpj.value);
    const k = cnpjKey(cnpj.value);
    const nome = k ? CNPJ_TO_CLIENTE[k] : '';
    cli.value = nome || '';
  });
}

let activeTab = 'orc';
function setTab(tab){
  activeTab = tab;

  document.getElementById('sheet_pros').style.display = tab === 'pros' ? 'flex' : 'none';

function stamp(){

/* ===== Baixar PDF (aba ativa) — via clone com texto estático ===== */
document.getElementById('btnPdf').addEventListener('click', async () => {
  acClose();
  const src = document.getElementById('sheet_'+activeTab);
  src.querySelectorAll('.prop, .ult, .orig').forEach(i => { if (i.value.trim() !== '') i.value = 'R$ ' + BRLnum(parseNum(i.value)); });
  recalc(activeTab);

  const clone = src.cloneNode(true);
  clone.style.cssText += ';position:absolute;left:-10000px;top:0;width:210mm;box-shadow:none;display:flex;flex-direction:column;min-height:0;';
  const sF = src.querySelectorAll('input, textarea');
  const cF = clone.querySelectorAll('input, textarea');
  cF.forEach((el, i) => {
    const div = document.createElement('div');
    div.textContent = sF[i].value || '';
    const isItem = el.classList.contains('item');
    const isParty = !!el.closest('.party');
    const fs = getComputedStyle(sF[i]).fontSize;
    if (isParty) div.style.cssText = 'padding:3px 0;font-size:12.5px;font-weight:'+(el.readOnly?'600':'500')+';color:'+(el.readOnly?'#0F3C6E':'#1a2b3c')+';min-height:20px;';
    else div.style.cssText = 'padding:8px 7px;font-size:'+fs+';font-family:inherit;line-height:1.35;white-space:nowrap;overflow:hidden;' + (isItem ? 'text-align:left;font-weight:600;color:#0F3C6E;white-space:normal;word-break:break-word;' : 'text-align:right;color:#1a2b3c;');
    el.replaceWith(div);
  });
  clone.querySelectorAll('.rm, .addwrap').forEach(e => e.remove());
  document.body.appendChild(clone);
  // Preenche até completar página(s) A4 inteira(s) para o rodapé ir ao pé da página
  const pxPerMmCSS = clone.offsetWidth / 210;
  const pageHcss = 297 * pxPerMmCSS;
  const natural = clone.scrollHeight;
  const pgs = Math.max(1, Math.ceil((natural - 2) / pageHcss));
  clone.style.height = (pgs * pageHcss) + 'px';

  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    const scale = 2;
    const canvas = await html2canvas(clone, { scale, backgroundColor:'#ffffff', useCORS:true, windowWidth: clone.offsetWidth, windowHeight: clone.offsetHeight });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWmm = 210, pageHmm = 297;
    const pxPerMm = canvas.width / pageWmm;
    const pageHpx = Math.floor(pageHmm * pxPerMm);
    const cRect = clone.getBoundingClientRect();
    const marks = new Set([0, canvas.height]);
    const top = el => marks.add(Math.round((el.getBoundingClientRect().top - cRect.top) * scale));
    const bot = el => marks.add(Math.round((el.getBoundingClientRect().bottom - cRect.top) * scale));
    const th = clone.querySelector('thead'); if (th) bot(th);
    clone.querySelectorAll('tbody tr').forEach(top);
    const co = clone.querySelector('.callout'); if (co){ top(co); bot(co); }
    const ft = clone.querySelector('.foot'); if (ft) top(ft);
    const cuts = [...marks].filter(v => v >= 0 && v <= canvas.height).sort((a,b) => a-b);
    let start = 0, firstPage = true;
    while (start < canvas.height - 1){
      const remain = canvas.height - start;
      let end;
      if (remain <= pageHpx + 3) end = canvas.height;
      else { end = start + pageHpx; let cut = -1; for (const v of cuts) if (v > start && v <= end) cut = v; if (cut > start) end = cut; }
      const sliceH = end - start;
      const tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = sliceH;
      const ctx = tmp.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height);
      ctx.drawImage(canvas, 0, start, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      if (!firstPage) pdf.addPage();
      pdf.addImage(tmp.toDataURL('image/png'), 'PNG', 0, 0, pageWmm, Math.min(sliceH / pxPerMm, pageHmm));
      firstPage = false; start = end;
    }
    const n = new Date(); const p = x => String(x).padStart(2,'0');
    const nome = activeTab === 'pros' ? 'Prospector' : 'Orcamento';
    pdf.save(`${nome}_Dellamed_${p(n.getDate())}-${p(n.getMonth()+1)}-${n.getFullYear()}.pdf`);
  } catch(err){ console.error(err); alert('Falha ao gerar o PDF. Use o botão Imprimir como alternativa.'); }
  finally { clone.remove(); }
});

document.getElementById('btnSync').addEventListener('click', async (e) => {
  const b = e.currentTarget, txt = b.textContent;
